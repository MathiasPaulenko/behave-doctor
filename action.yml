name: behave-doctor
description: Static diagnostics and impact analysis for Behave BDD suites — no test execution needed.
author: MathiasPaulenko
branding:
  icon: activity
  color: green

inputs:
  mode:
    description: "scan (suite diagnostics) or impact (changed-files → affected scenarios)"
    required: false
    default: scan
  path:
    description: Path to the project/features root
    required: false
    default: "."
  base:
    description: Base ref for impact mode diff (defaults to the PR base SHA)
    required: false
    default: ${{ github.event.pull_request.base.sha }}
  args:
    description: Extra args appended to the behave-doctor command
    required: false
    default: ""

outputs:
  affected-scenarios:
    description: Newline-separated scenario names affected by the change (impact mode)
    value: ${{ steps.impact.outputs.names }}

runs:
  using: composite
  steps:
    - name: Install behave-doctor
      shell: bash
      run: pip install behave-doctor

    - name: Fetch base for diff
      if: inputs.mode == 'impact'
      shell: bash
      run: |
        BASE="${{ inputs.base }}"
        [ -z "$BASE" ] && BASE="main"
        git fetch --depth=50 origin "$BASE" || git fetch --depth=50 origin main

    - name: Run scan
      if: inputs.mode == 'scan'
      shell: bash
      run: behave-doctor scan "${{ inputs.path }}" ${{ inputs.args }}

    - name: Run impact analysis
      id: impact
      if: inputs.mode == 'impact'
      shell: bash
      run: |
        # --diff-filter=d drops deleted files — behave-doctor requires the
        # changed files to exist on disk.
        BASE="${{ inputs.base }}"
        [ -z "$BASE" ] && BASE="origin/main"
        CHANGED=$(git diff --name-only --diff-filter=d "$BASE...HEAD" | grep -E '\.(py|feature)$' || true)
        echo "Changed files: $CHANGED"
        ARGS=()
        while IFS= read -r f; do [ -n "$f" ] && ARGS+=(-c "$f"); done <<< "$CHANGED"
        NAMES=$(behave-doctor impact "${{ inputs.path }}" "${ARGS[@]}" --format names ${{ inputs.args }} || true)
        # Unique delimiter so a scenario name can never close the heredoc.
        DELIM="bd_names_$$_$RANDOM"
        echo "names<<$DELIM" >> "$GITHUB_OUTPUT"
        echo "$NAMES" >> "$GITHUB_OUTPUT"
        echo "$DELIM" >> "$GITHUB_OUTPUT"
        echo "$NAMES"
